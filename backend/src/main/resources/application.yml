spring:
  application:
    name: oupay-backend
  autoconfigure:
    # No default in-memory user (and no generated password): every login goes through AuthService.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${OUPAY_DB_URL:jdbc:postgresql://localhost:5432/oupay}
    username: ${OUPAY_DB_USER:oupay}
    password: ${OUPAY_DB_PASSWORD:}
    hikari:
      pool-name: oupay-pool
      # Size the pool to the database, not to the traffic: a few connections per CPU core of the DB server.
      maximum-pool-size: ${OUPAY_DB_POOL_MAX:10}
      minimum-idle: ${OUPAY_DB_POOL_MIN_IDLE:2}
      # Fail fast when the pool is exhausted instead of letting requests pile up.
      connection-timeout: ${OUPAY_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      idle-timeout: 600000
      # Retire connections before a firewall / PgBouncer / server limit silently drops them.
      max-lifetime: 1500000
      keepalive-time: 300000
      leak-detection-threshold: ${OUPAY_DB_LEAK_DETECTION_MS:0}
      # Server-side guards for every connection: no runaway query, no endless lock wait, no forgotten transaction.
      # Replace the whole statement with OUPAY_DB_CONNECTION_INIT_SQL (for example "SELECT 1") behind a transaction
      # pooler, where session-level SET is not reliable; then rely on the socket and query timeouts below.
      connection-init-sql: ${OUPAY_DB_CONNECTION_INIT_SQL:SET statement_timeout = '${OUPAY_DB_STATEMENT_TIMEOUT:30s}'; SET lock_timeout = '${OUPAY_DB_LOCK_TIMEOUT:10s}'; SET idle_in_transaction_session_timeout = '${OUPAY_DB_IDLE_TX_TIMEOUT:60s}'}
      data-source-properties:
        connectTimeout: 10
        socketTimeout: 60
        tcpKeepAlive: true
        ApplicationName: oupay-backend
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway. Hibernate only validates that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      jakarta:
        persistence:
          query:
            timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations should run over a DIRECT database connection (no pooler: DDL, advisory locks and session settings
    # are not reliable through a transaction pooler). Set OUPAY_FLYWAY_DB_URL (and user/password if they differ)
    # when the application itself uses a pooled URL.
    # Unset means: the same connection as the application (these placeholders resolve to the datasource settings).
    url: ${OUPAY_FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${OUPAY_FLYWAY_DB_USER:${spring.datasource.username}}
    password: ${OUPAY_FLYWAY_DB_PASSWORD:${spring.datasource.password}}
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: 30s
  mail:
    # spring.mail.host is deliberately NOT set here: without it no mail sender exists (development uses the sink).
    # The prod profile requires it.
    port: ${OUPAY_SMTP_PORT:587}
    properties:
      mail:
        smtp:
          auth: ${OUPAY_SMTP_AUTH:true}
          starttls:
            enable: ${OUPAY_SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

server:
  # Platforms such as Render hand the port over in PORT and need the process reachable from outside the container.
  port: ${PORT:8080}
  address: ${OUPAY_BIND_ADDRESS:0.0.0.0}
  shutdown: graceful
  # Set to "native" when running behind a TRUSTED reverse proxy so the real client IP is used.
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 10s
    threads:
      max: ${OUPAY_HTTP_THREADS:100}
    max-swallow-size: 256KB
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      # An SMTP outage must not mark the whole service DOWN; the e-mail outbox health indicator reports it instead.
      enabled: false
  endpoints:
    web:
      exposure:
        # Health only. Metrics are NOT exposed over HTTP here (any signed-in user could read them).
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      status:
        # DEGRADED (e-mail delivery trouble) is reported, but must not take the service out of rotation.
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
      group:
        liveness:
          include: livenessState
        # Readiness = can serve traffic: the database must answer. E-mail is deliberately not part of it.
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

oupay:
  app:
    # The browser application, used to build links in e-mails.
    base-url: ${OUPAY_APP_BASE_URL:http://localhost:5173}
  security:
    session:
      # true in production (HTTPS only). The dev profile turns it off for plain-http localhost.
      secure-cookie: true
    proxy:
      # Comma-separated IPs/CIDRs of reverse proxies whose X-Forwarded-For is believed. Empty: header ignored.
      trusted: ${OUPAY_TRUSTED_PROXIES:}
    origins:
      # Extra origins allowed for state-changing browser requests (same-host is always allowed).
      allowed: ${OUPAY_ALLOWED_ORIGINS:}
  rate-limit:
    public-read-per-minute: ${OUPAY_RATE_LIMIT_PUBLIC_READ:120}
    public-write-per-minute: ${OUPAY_RATE_LIMIT_PUBLIC_WRITE:20}
    auth-per-minute: ${OUPAY_RATE_LIMIT_AUTH:20}
    recovery-per-minute: ${OUPAY_RATE_LIMIT_RECOVERY:10}
    webhook-per-minute: ${OUPAY_RATE_LIMIT_WEBHOOK:600}
  email:
    provider: ${OUPAY_EMAIL_PROVIDER:sink}
    from: ${OUPAY_EMAIL_FROM:OuPay <no-reply@oupay.rw>}
    sink-endpoint-enabled: false
  integrations:
    # The simulated provider is for local development ONLY. It is disabled unless explicitly enabled,
    # and it needs a shared secret: there is no default.
    simulated:
      enabled: false
      shared-secret: ""
  public-payments:
    base-url: ${OUPAY_PUBLIC_PAYMENT_BASE_URL:https://pay.oupay.rw}
