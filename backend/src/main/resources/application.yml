spring:
  application:
    name: oupay-backend
  autoconfigure:
    # No default in-memory user (and no generated password): every login goes through AuthService.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${OUPAY_DB_URL:jdbc:postgresql://localhost:5432/oupay}
    username: ${OUPAY_DB_USER:oupay}
    password: ${OUPAY_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway. Hibernate only validates that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  # Set to "native" when running behind a TRUSTED reverse proxy so the real client IP is used.
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

oupay:
  security:
    session:
      # true in production (HTTPS only). The dev profile turns it off for plain-http localhost.
      secure-cookie: true
  rate-limit:
    public-read-per-minute: 120
    public-write-per-minute: 20
    auth-per-minute: 20
    webhook-per-minute: 600
  integrations:
    # The simulated provider is for local development ONLY. It is disabled unless explicitly enabled,
    # and it needs a shared secret: there is no default.
    simulated:
      enabled: false
      shared-secret: ""
  public-payments:
    base-url: https://pay.oupay.rw
