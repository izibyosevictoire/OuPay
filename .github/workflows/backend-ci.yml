name: OuPay Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Java 21 - Maven - PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: oupay_test
          POSTGRES_USER: oupay
          POSTGRES_PASSWORD: test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oupay -d oupay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      OUPAY_TEST_DB_URL: jdbc:postgresql://localhost:5432/oupay_test
      OUPAY_TEST_DB_USER: oupay
      OUPAY_TEST_DB_PASSWORD: test_password_only
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build and run backend tests
        run: mvn -B clean verify
